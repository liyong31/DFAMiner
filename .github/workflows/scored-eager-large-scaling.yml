name: Scored eager scaling beyond 6000 states
on:
  push:
    branches: [codex/scored-eager-large-scaling]
  workflow_dispatch:
jobs:
  scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install python-sat dfa
      - name: Large case comparison
        run: |
          python -u benchmarks/compare_scored_information.py --cases sparse9600 sparse19200 --modes baseline bound impact300 short300 degree300 --seconds 60 --output scaling.json | tee scaling.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scored-eager-large-scaling
          path: |
            scaling.json
            scaling.log
