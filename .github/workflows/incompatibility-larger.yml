name: Larger incompatibility scaling
on:
  push:
    branches: [codex/incremental-incompatibility]
  workflow_dispatch:
jobs:
  larger:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-sat dfa
      - name: Scale to 4800 labelled samples
        run: |
          python -u benchmarks/compare_clique_scaling.py --sample-count 4800 --seconds 60 --output scaling4800.json | tee scaling4800.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scaling4800
          path: |
            scaling4800.json
            scaling4800.log
