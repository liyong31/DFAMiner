name: Source symmetry soundness
on:
  push:
    branches: [codex/3dfa-preprocess-symmetry]
  workflow_dispatch:
jobs:
  proof-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install python-sat dfa
      - run: python -m unittest discover -s tests -p test_preprocess_symmetry.py -v
