name: Incremental incompatibility verification
on:
  push:
    branches:
      - codex/incremental-incompatibility
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install solver
        run: python -m pip install python-sat dfa
      - name: Run differential and SAT correctness tests
        run: python -m unittest discover -s tests -p 'test_incremental_incompatibility.py' -v
      - name: Measure construction overhead and lower bounds
        run: python -u benchmarks/compare_incompatibility.py
