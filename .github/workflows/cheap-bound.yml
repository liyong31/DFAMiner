name: Cheap certified DFA bound
on:
  push:
    branches: [codex/cheap-incompatibility-bound]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-sat dfa
      - run: python -m unittest discover -s tests -p test_cheap_bound.py -v
      - run: python -u benchmarks/benchmark_cheap_bound.py
