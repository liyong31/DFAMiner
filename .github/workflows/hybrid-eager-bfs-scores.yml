name: Hybrid eager BFS scored SAT benchmarks
on:
  push:
    branches: [codex/hybrid-eager-bfs-scored]
  workflow_dispatch:
jobs:
  medium:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install python-sat dfa
      - run: python -u benchmarks/compare_hybrid_bfs_scores.py --cases repo7 repo8 repo10 sparse2400 --timeout 22 --output medium.json | tee medium.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-medium
          path: |
            medium.json
            medium.log
  large:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install python-sat dfa
      - run: python -u benchmarks/compare_hybrid_bfs_scores.py --cases sparse4800 sparse9600 --timeout 38 --output large.json | tee large.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-large
          path: |
            large.json
            large.log
